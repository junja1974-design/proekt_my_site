<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Генератор идей для постов: эксперты, сторис и контент-план" />
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page">
  <div class="page__bg" aria-hidden="true"></div>
  <div class="page__grain" aria-hidden="true"></div>

  <main class="shell" id="main">
    <header class="hero">
      <p class="hero__eyebrow">контент-студия</p>
      <h1 class="hero__title" id="hero-title">Генератор идей для постов</h1>
      <p class="hero__lead">Выберите формат и начните творить</p>
    </header>

    <section class="ideas" aria-labelledby="ideas-heading">
      <h2 id="ideas-heading" class="visually-hidden">Варианты генерации</h2>
      <ul class="ideas__list" role="list">
        <li class="idea-card">
          <span class="idea-card__marker" aria-hidden="true"></span>
          <span class="idea-card__text">5 идей постов для экспертов</span>
        </li>
        <li class="idea-card">
          <span class="idea-card__marker" aria-hidden="true"></span>
          <span class="idea-card__text">3 идеи сторис на сегодня</span>
        </li>
        <li class="idea-card">
          <span class="idea-card__marker" aria-hidden="true"></span>
          <span class="idea-card__text">контент-план на неделю</span>
        </li>
      </ul>
    </section>

    <div class="page__rule" aria-hidden="true"></div>
  </main>
</body>
</html>
