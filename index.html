<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Генератор идей для постов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0f0c1d;
      --bg-card: rgba(255, 255, 255, 0.06);
      --accent: #a78bfa;
      --accent-2: #f472b6;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --border: rgba(167, 139, 250, 0.35);
      --glow: rgba(167, 139, 250, 0.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: "Manrope", system-ui, sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      overflow-x: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      z-index: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(167, 139, 250, 0.35), transparent),
        radial-gradient(ellipse 60% 40% at 100% 50%, rgba(244, 114, 182, 0.12), transparent),
        radial-gradient(ellipse 50% 35% at 0% 80%, rgba(96, 165, 250, 0.1), transparent);
      animation: bgShift 18s ease-in-out infinite alternate;
    }

    @keyframes bgShift {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.92; transform: scale(1.05); }
    }

    .noise {
      position: fixed;
      inset: 0;
      z-index: 1;
      opacity: 0.035;
      pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    main {
      position: relative;
      z-index: 2;
      max-width: 560px;
      margin: 0 auto;
      padding: clamp(2rem, 8vw, 4rem) 1.5rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
      animation: fadeDown 0.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
    }

    @keyframes fadeDown {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      font-size: clamp(1.75rem, 5vw, 2.25rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.2;
      background: linear-gradient(120deg, var(--text) 0%, var(--accent) 45%, var(--accent-2) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 0.65rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      font-weight: 400;
      animation: pulseSoft 4s ease-in-out infinite;
    }

    @keyframes pulseSoft {
      0%, 100% { opacity: 0.85; }
      50% { opacity: 1; }
    }

    ul {
      list-style: none;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .item {
      position: relative;
      padding: 1.15rem 1.25rem 1.15rem 3.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      opacity: 0;
      animation: slideIn 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transition:
        transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
        border-color 0.35s ease,
        box-shadow 0.35s ease;
    }

    .item:nth-child(1) { animation-delay: 0.15s; }
    .item:nth-child(2) { animation-delay: 0.3s; }
    .item:nth-child(3) { animation-delay: 0.45s; }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-24px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .item::before {
      content: "";
      position: absolute;
      left: 1rem;
      top: 50%;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      transform: translateY(-50%);
      box-shadow: 0 0 16px var(--glow);
      animation: dotBreathe 3s ease-in-out infinite;
    }

    .item:nth-child(2)::before { animation-delay: 0.4s; }
    .item:nth-child(3)::before { animation-delay: 0.8s; }

    @keyframes dotBreathe {
      0%, 100% { transform: translateY(-50%) scale(1); opacity: 1; }
      50% { transform: translateY(-50%) scale(1.25); opacity: 0.85; }
    }

    .item:hover {
      transform: translateX(6px) scale(1.01);
      border-color: rgba(244, 114, 182, 0.5);
      box-shadow:
        0 12px 40px rgba(0, 0, 0, 0.35),
        0 0 0 1px rgba(167, 139, 250, 0.15) inset;
    }

    .item span {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .decorative-line {
      margin: 2.5rem auto 0;
      height: 2px;
      max-width: 120px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), var(--accent-2), transparent);
      opacity: 0;
      animation: lineGrow 1s ease 0.6s forwards;
    }

    @keyframes lineGrow {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 0.85; }
    }
  </style>
</head>
<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

  <main>
    <header>
      <h1>Генератор идей для постов</h1>
      <p class="subtitle">Выберите формат и начните творить</p>
    </header>

    <ul class="list">
      <li class="item"><span>5 идей постов для экспертов</span></li>
      <li class="item"><span>3 идеи сторис на сегодня</span></li>
      <li class="item"><span>контент-план на неделю</span></li>
    </ul>

    <div class="decorative-line" aria-hidden="true"></div>
  </main>
</body>
</html>
